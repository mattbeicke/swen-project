<div class="overall">
    <aside class="sidebar">
        <nav>
            <a routerLink="/cupboard">Needs</a><br>
            <a routerLink="/account">Account Management</a><br>
            <a routerLink="/basket">Basket</a><br>
        </nav>
    </aside>

    <div>
        <div class="content">
            <h1 class="stick">All Users</h1>
            <table class="users">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of users | async">
                        <td>{{user.username}}</td>
                        <td>
                            <button [class.selected]="user === selectedUser" type="button" (click)="onSelect(user)">{{
                                user.banned ? 'Unban' : 'Ban' }}</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <aside class="sidebarr">
        <br><br>
        <input class="search" #searchBox id="search-box" (input)="search(searchBox.value)" placeholder="Search Users">
    </aside>
</div>
