<div class="overall">

    <app-sidebar></app-sidebar>

    <div class="content">
        <h1 class="stick">Your Basket</h1>
        <table class="needs">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let need of needs$">
                    <td>{{need.name}}</td>
                    <td>{{need.description}}</td>
                    <td>
                        <button [class.selected]="need === selectedNeed" type="button" (click)="remove(need)">Remove
                            From Basket</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <aside class="sidebarr">
        <button type="button" class="checkout" (click)="checkout()">Checkout Basket</button>
    </aside>
</div>
