<div *ngIf="!passfield">
    <p>{{question}}</p>
    <input type="text" [(ngModel)]="response">
    <input type="button" (click)="verify()">Verify
</div>

<div *ngIf="passfield">
    <p>Enter a new password:</p>
    <input type="password" [(ngModel)]="password">
    <input type="button" (click)="reset()">Reset Password
</div>
