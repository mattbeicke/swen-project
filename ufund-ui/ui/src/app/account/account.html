<div class="container">

    <app-sidebar></app-sidebar>

    <div class="content">
        <div *ngIf="isHelper" class="grid-item">
            <button class="dark-button" *ngIf="!showNameBox" (click)="flipUser()">
                Change <br> Username
            </button>
            <div *ngIf="showNameBox" class="input-group">
                <input [(ngModel)]="username" placeholder="New Username" class="input">
                <button type="button" class="confirm dark-button" (click)="changeUsername()">Confirm</button>
            </div>
        </div>

        <div class="grid-item">
            <button class="dark-button" type="button" *ngIf="!showPassBox" (click)="flipPass()">Change <br> Password</button>
            <div *ngIf="showPassBox" class="input-group">
                <input type="password" [(ngModel)]="password" placeholder="New Password" class="input">
                <button type="button" class="dark-button confirm" (click)="changePassword()">Confirm</button>
            </div>
        </div>
        
        <div>
            <button class="delete dark-button" type="button" *ngIf="isHelper" (click)="deleteUser()">DELETE <br> ACCOUNT</button>
        </div>
    </div>
</div>
