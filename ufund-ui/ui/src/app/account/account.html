<div class="container">

  <app-sidebar></app-sidebar>

    <div class="content">
        <div *ngIf="isHelper">
            <button type="button" class="add-button" (click)="changeUsername()">
                Change Username
            </button>
        </div>

        <button type="button" class="add-button" (click)="changePassword()">
            Change Password
        </button>

        <button type="button" (click)="logout()">Log out</button>

        <button type="button" *ngIf="isHelper" (click)="deleteUser()">DELETE ACCOUNT</button>
    </div>
</div>
