<div class="overall">
    <app-sidebar></app-sidebar>

    <div>
        <div class="content">
            <h1 class="stick">Top {{n}} Highest Contributors</h1>
            <table class="users">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Contributions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of users">
                        <td>{{user.username}}</td>
                        <td>{{user.contributions}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <aside class="sidebarr">
        <input type="number" [(ngModel)]="n" #maxNumber class="amount" (input)="getTop(maxNumber.valueAsNumber)" placeholder="# of Displayed Users">
    </aside>
</div>
