<div id="login-form">
    <span class="title">Login for Goated U-Fund</span>
    <p>
        <input id="username-in" [(ngModel)]="username" placeholder="Username" class="login-form-input"> <!--  -->
        <br>
        <input type="password" id="password-in" [(ngModel)]="password" placeholder="Password" class="login-form-input">
    </p>
    <button type="button" (click)="login()">Login</button>
    <br>
    <button (click)="createAccount()">Create Account</button>
    <br><br>
    <button (click)="forgotPassword()">Forgot Password</button>
    <p>{{message}}</p>
    <button class="back" (click)="goHome()">< Home</button>
</div>
