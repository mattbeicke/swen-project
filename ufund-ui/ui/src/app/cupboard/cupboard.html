<div class="overall">
    <aside class="sidebar">
        <nav>
            <a routerLink="/cupboard">Needs</a><br>
            <a routerLink="/account">Account Management</a><br>
            <a routerLink="/baskettab">Basket</a><br>
        </nav>
    </aside>

    <div>
        <div class="content">
            <h1 class="stick">All Needs</h1>
            <table class="needs">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let need of needs$ | async">
                        <td>{{need.name}}</td>
                        <td>{{need.description}}</td>
                        <td>
                            <button [class.selected]="need === selectedNeed" type="button"
                                (click)="onSelect(need)">{{bText}}</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <aside class="sidebarr">
        <br><br>
        <div *ngIf="isManager">
            <button>create need</button>
        </div>
        <input class="search" #searchBox id="search-box" (input)="search(searchBox.value)" placeholder="Search Needs">
    </aside>
</div>
