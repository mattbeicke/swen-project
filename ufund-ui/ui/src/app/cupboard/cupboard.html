<div class="container">
    <aside class="sidebar">
        <nav>
            <a routerLink="/cupboard">Needs</a><br>
            <a routerLink="/account">Account Management</a><br>
            <a routerLink="/baskettab">Basket</a><br>
        </nav>
    </aside>

    <div class="content">
        <h1 class="stick">All Needs</h1>
        <table class="needs">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let need of needs">
                    <td>{{need.name}}</td>
                    <td>{{need.description}}</td>
                    <td>
                        <button [class.selected]="need === selectedNeed" type="button"
                            (click)="onSelect(need)">{{bText}}</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
